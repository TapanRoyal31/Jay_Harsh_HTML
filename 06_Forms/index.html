<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- User data as input -->
     <form action="welcome.html">
        <label for="name">Name :</label>
        <input type="text" id="name" placeholder="Enter Your Name" required autofocus>
        <br>
        <label for="email">Email :</label>
        <input type="email" name="email" id="email" placeholder="Enter you email" readonly>
        <br>
        <label for="pass">Password :</label>
        <input type="password" name="pass" id="pass" placeholder="Enter your password" minlength="2" maxlength="8" disabled>
        <br><br>
        <button type="submit">Submit</button>
     </form>
</body>
</html>
